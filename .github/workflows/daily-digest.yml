name: Daily Update Digest

on:
  schedule:
    # 每天 20:00 北京时间 = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send daily digest via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPDATE_HUB_URL: ${{ secrets.UPDATE_HUB_URL }}
          UPDATE_HUB_TOKEN: ${{ secrets.UPDATE_HUB_TOKEN }}
        run: node scripts/daily-digest.js
