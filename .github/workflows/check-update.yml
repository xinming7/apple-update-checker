name: Check Apple Updates

on:
  schedule:
    # 名义上每 6 小时一次（UTC 18/00/06/12）。
    #
    # 注意：cron 只是"名义"时间。实测本仓库 2026-10-01 ~ 10-14 的 12 次调度运行，
    # 实际都落在 UTC 07:15~09:05，比名义点晚 5~7 小时；官方文档也明确 schedule
    # 在高负载时会延迟甚至整个丢弃。别指望准时，只当"一天跑几次"。
    # 需要精确时间得靠外部触发（workflow_dispatch + 外部 cron），本项目没做。
    - cron: '0 18,0,6,12 * * *'
  workflow_dispatch: # 手动触发

concurrency:
  group: check-apple-updates
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 第一步：检查系统更新（支持平台过滤）
      - name: Check updates
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPDATE_HUB_URL: ${{ secrets.UPDATE_HUB_URL }}
          UPDATE_HUB_TOKEN: ${{ secrets.UPDATE_HUB_TOKEN }}
          PLATFORMS: ${{ vars.PLATFORMS }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          OUTPUT=$(node scripts/check-updates.js 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "NEW UPDATES DETECTED"; then
            echo "has_new_updates=true" >> $GITHUB_OUTPUT
            NEW_ITEMS=$(echo "$OUTPUT" | grep "^NEW:" | sed 's/^NEW: /- /')
            echo "new_updates<<EOF" >> $GITHUB_OUTPUT
            echo "$NEW_ITEMS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_new_updates=false" >> $GITHUB_OUTPUT
          fi

      # 第二步：扫描安全公告（CVE + release notes）
      # 解析失败时脚本保留旧数据并输出 SECURITY SCAN DEGRADED（退出码仍为 0，不阻断后续步骤）
      - name: Scan security updates
        id: security
        run: |
          OUTPUT=$(node scripts/security-scanner.js 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "SECURITY SCAN DEGRADED"; then
            echo "### ⚠️ 安全公告解析失败，已保留上次有效数据" >> $GITHUB_STEP_SUMMARY
            echo "SECURITY_SCAN_DEGRADED" >> $GITHUB_STEP_SUMMARY
          fi

      # 第三步：生成 RSS Feed
      - name: Generate RSS Feed
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: node scripts/generate-rss.js

      # 第四步：创建 Issue
      - name: Create Issue for new updates
        if: steps.check.outputs.has_new_updates == 'true'
        uses: actions/github-script@v7
        env:
          # 通过环境变量传递，避免把外部数据直接内插进脚本（脚本注入面）
          NEW_UPDATES: ${{ steps.check.outputs.new_updates }}
        with:
          script: |
            // 标题日期用北京时间（项目约定的展示时区）。一天多次运行共用同一日期。
            const bjDate = new Date(Date.now() + 8 * 3600000).toISOString().split('T')[0];
            const title = `🍎 Apple 系统更新 - ${bjDate}`;
            const newUpdates = process.env.NEW_UPDATES || '';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const { owner, repo } = context.repo;

            const issues = await github.rest.issues.listForRepo({
              owner, repo,
              state: 'open',
              labels: 'apple-update',
              per_page: 100
            });

            // 同日已有 Issue：把新发现追加为评论，不再整批吞掉（一天多次运行的第二批更新）
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: existing.number,
                body: `## 追加检测到的新更新\n\n${newUpdates}`
              });
              console.log(`Appended to existing issue #${existing.number}`);
              return;
            }

            // 创建新 Issue 前，关闭同标签的其他 open Issue，避免无限堆积
            for (const old of issues.data) {
              await github.rest.issues.update({
                owner, repo,
                issue_number: old.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: old.number,
                body: '已有更新的检测 Issue，自动关闭。'
              });
              console.log(`Closed old issue #${old.number}`);
            }

            const body = `## 检测到新的 Apple 系统更新\n\n${newUpdates}\n\n详细信息请查看 [UPDATE_STATUS.md](${repoUrl}/blob/main/UPDATE_STATUS.md)\n\n安全公告: [SECURITY_STATUS.md](${repoUrl}/blob/main/SECURITY_STATUS.md)\n\nRSS Feed: [feed.xml](${repoUrl}/blob/main/feed.xml)\n\n---\n*由 GitHub Actions 自动创建*`;

            const issue = await github.rest.issues.create({
              owner, repo,
              title, body,
              labels: ['apple-update']
            });
            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);

      # 第五步：提交变更
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ UPDATE_STATUS.md SECURITY_STATUS.md feed.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Apple system info [$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')]"
            git push
          fi
