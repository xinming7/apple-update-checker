name: Check Apple Updates

on:
  schedule:
    # 每天 UTC 02:00 检查（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 手动触发

concurrency:
  group: check-apple-updates
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 第一步：检查系统更新（支持平台过滤）
      - name: Check updates
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPDATE_HUB_URL: ${{ secrets.UPDATE_HUB_URL }}
          UPDATE_HUB_TOKEN: ${{ secrets.UPDATE_HUB_TOKEN }}
          PLATFORMS: ${{ vars.PLATFORMS }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          OUTPUT=$(node scripts/check-updates.js 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "NEW UPDATES DETECTED"; then
            echo "has_new_updates=true" >> $GITHUB_OUTPUT
            NEW_ITEMS=$(echo "$OUTPUT" | grep "^NEW:" | sed 's/^NEW: /- /')
            echo "new_updates<<EOF" >> $GITHUB_OUTPUT
            echo "$NEW_ITEMS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_new_updates=false" >> $GITHUB_OUTPUT
          fi

      # 第二步：扫描安全公告（CVE + release notes）
      - name: Scan security updates
        run: node scripts/security-scanner.js

      # 第三步：生成 RSS Feed
      - name: Generate RSS Feed
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: node scripts/generate-rss.js

      # 第四步：创建 Issue
      - name: Create Issue for new updates
        if: steps.check.outputs.has_new_updates == 'true'
        uses: actions/github-script@v7
        env:
          # 通过环境变量传递，避免把外部数据直接内插进脚本（脚本注入面）
          NEW_UPDATES: ${{ steps.check.outputs.new_updates }}
        with:
          script: |
            const title = `🍎 Apple 系统更新 - ${new Date().toISOString().split('T')[0]}`;
            const newUpdates = process.env.NEW_UPDATES || '';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const body = `## 检测到新的 Apple 系统更新\n\n${newUpdates}\n\n详细信息请查看 [UPDATE_STATUS.md](${repoUrl}/blob/main/UPDATE_STATUS.md)\n\n安全公告: [SECURITY_STATUS.md](${repoUrl}/blob/main/SECURITY_STATUS.md)\n\nRSS Feed: [feed.xml](${repoUrl}/blob/main/feed.xml)\n\n---\n*由 GitHub Actions 自动创建*`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'apple-update',
              per_page: 100
            });

            const existingIssue = issues.data.find(i => i.title === title);
            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['apple-update']
            });
            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);

      # 第五步：提交变更
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ UPDATE_STATUS.md SECURITY_STATUS.md feed.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Apple system info [$(date +%Y-%m-%d)]"
            git push
          fi
